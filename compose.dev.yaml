services:
  web:
    environment:
      CIVICLOOP_ENV: development
    volumes:
      - ./backend:/app/backend

  frontend:
    image: node:22.23.0-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      web:
        condition: service_healthy

volumes:
  frontend-node-modules:
