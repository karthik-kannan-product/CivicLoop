name: civicloop

x-app: &app
  build:
    context: .
  image: civicloop:local
  env_file:
    - .env
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=1777

services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["manage", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${CIVICLOOP_IDENTITY_KEY_HOST_PATH:?Set an absolute host identity-key path}:/run/secrets/civicloop-identity-keyring.json:ro

  web:
    <<: *app
    command: ["web"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${CIVICLOOP_IDENTITY_KEY_HOST_PATH:?Set an absolute host identity-key path}:/run/secrets/civicloop-identity-keyring.json:ro
      - ${CIVICLOOP_INTEGRATION_KEY_HOST_PATH:?Set an absolute host integration-key path}:/run/secrets/civicloop-integration-keyring.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ["worker"]
    environment:
      CIVICLOOP_ADMIN_IDENTITY_ENABLED: "false"
      CIVICLOOP_IDENTITY_KEY_FILE: ""
    volumes:
      - ${CIVICLOOP_INTEGRATION_KEY_HOST_PATH:?Set an absolute host integration-key path}:/run/secrets/civicloop-integration-keyring.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["scheduler"]
    environment:
      CIVICLOOP_ADMIN_IDENTITY_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
volumes:
  postgres-data:
