model_list:
  - model_name: civicloop-default
    litellm_params:
      model: os.environ/LITELLM_UPSTREAM_MODEL
      api_base: os.environ/LITELLM_UPSTREAM_BASE_URL
      api_key: os.environ/LITELLM_UPSTREAM_API_KEY
      timeout: 60
      stream_timeout: 20
      max_tokens: 2000

router_settings:
  timeout: 60
  num_retries: 0

litellm_settings:
  request_timeout: 60
  turn_off_message_logging: true
  redact_user_api_key_info: true
  cache: false
  callbacks: []
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  store_prompts_in_spend_logs: false
  disable_spend_logs: true
  reject_clientside_metadata_tags: true
  global_max_parallel_requests: 1
