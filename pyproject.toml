[project]
name = "civicloop"
version = "0.1.0"
description = "Open-source agentic workflow loops for nonprofit operations"
requires-python = ">=3.11,<3.12"
dependencies = [
  "celery[redis]>=5.6,<5.7",
  "cryptography>=50,<51",
  "dj-database-url>=3,<4",
  "django>=5.2.17,<5.3",
  "django-otp>=1.7,<1.8",
  "gunicorn>=23,<24",
  "openinference-semantic-conventions>=0.1,<1",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "openapi-spec-validator>=0.7,<0.9",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-django>=4.11,<5",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "civicloop.settings"
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true
