[project]
name = "civicloop"
version = "0.1.0"
description = "Open-source agentic workflow loops for nonprofit operations"
requires-python = ">=3.11,<3.12"
dependencies = [
  "celery[redis]>=5.6,<5.7",
  "dj-database-url>=3,<4",
  "django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "openapi-spec-validator>=0.7,<0.9",
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "civicloop.settings"
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
