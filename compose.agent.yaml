# Agent profile remains disabled by default. Production requires reviewed image digests.
# File-backed source identities are copied by root to consumer-owned mode0400 volumes.
# Activate only after profile initializer completion; disabled worker has no profile dependency.
# Hermes vendor bootstrap needs UID/GID drop and root traversal capabilities;
# the controller runs as UID/GID10000 with no effective capabilities after that drop.
x-litellm-image-lock:
  release: v1.100.1
  index_digest: sha256:c36f3b27a5a817329e0fcf9c4e3a7bf58b62a5a736ad5352f0a5771c1be58404
  platform_manifest_digest: sha256:833abd09590afee0119dd574212fb01294dcc7d940ad21fabc0bf0681a9f4aea
  activation_allowed: false
x-hermes-image-lock:
  release: v2026.9.11
  source_commit: 939e45c91d751fadd94dcd1b873ac3cb44846213
  index_digest: sha256:9469b3e78b9545b6d576eb8887a95352e9a0ea83730eaf31431cf862ca1010e1
  activation_allowed: false
services:
  mcp:
    image: civicloop:local
    profiles:
    - agent
    command:
    - gunicorn
    - civicloop.wsgi:application
    - --bind
    - 0.0.0.0:8000
    - --workers
    - '1'
    - --limit-request-line
    - '2048'
    - --limit-request-field_size
    - '1024'
    env_file:
    - .env
    environment:
      DJANGO_SETTINGS_MODULE: agents.mcp_settings
      CIVICLOOP_MCP_TOKEN_FILE: /run/secrets/civicloop-mcp-token
      CIVICLOOP_ADMIN_IDENTITY_ENABLED: 'false'
      CIVICLOOP_INTEGRATIONS_ENABLED: 'false'
      CIVICLOOP_IDENTITY_KEY_FILE: ''
      CIVICLOOP_INTEGRATION_KEY_FILE: ''
    networks:
    - default
    - hermes-data
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      hermes-identities-init:
        condition: service_completed_successfully
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    restart: unless-stopped
    pids_limit: 64
    cpus: '0.25'
    mem_limit: 256m
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - agents.mcp_probe
      interval: 10s
      timeout: 3s
      retries: 12
    logging:
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - type: volume
      source: hermes-mcp-identities
      target: /run/secrets
      read_only: true
  worker:
    image: civicloop:local
    command:
    - worker
    networks:
    - default
    - agent-control
    environment:
      CIVICLOOP_HERMES_ENABLED: ${CIVICLOOP_HERMES_ENABLED:-false}
      CIVICLOOP_HERMES_PENDING_OPERATIONS_ENABLED: ${CIVICLOOP_HERMES_PENDING_OPERATIONS_ENABLED:-false}
      CIVICLOOP_HERMES_PROFILE_ID: ${CIVICLOOP_HERMES_PROFILE_ID:-}
      CIVICLOOP_HERMES_PROFILE_REVISION: ${CIVICLOOP_HERMES_PROFILE_REVISION:-1}
      CIVICLOOP_HERMES_ADAPTER_TOKEN_FILE: /run/secrets/civicloop-hermes-service-token
      CIVICLOOP_HERMES_ADAPTER_URL: http://hermes-adapter:8080
    volumes:
    - type: volume
      source: hermes-worker-identities
      target: /run/secrets
      read_only: true
  model-gateway-init:
    image: ghcr.io/berriai/litellm-non_root:v1.100.1@sha256:c36f3b27a5a817329e0fcf9c4e3a7bf58b62a5a736ad5352f0a5771c1be58404
    platform: linux/amd64
    profiles:
    - agent
    entrypoint:
    - python
    - /ops/scripts/model-gateway-ops-support.py
    command:
    - activate
    - --lock
    - /ops/image-lock.json
    - --approval
    - /source/model-gateway-approval.json
    - --signature
    - /source/model-gateway-approval.sig
    - --verifier
    - /source/model-gateway-approval-verifier
    - --handoff
    - /handoff
    - --ledger
    - /ledger
    - --operations-sha
    - ${CIVICLOOP_OPERATIONS_SHA:?Set exact private operations SHA}
    - --verifier-sha256
    - ${CIVICLOOP_MODEL_GATEWAY_APPROVAL_VERIFIER_SHA256:?Set verifier SHA256}
    - --trusted-signer
    - ${CIVICLOOP_MODEL_GATEWAY_TRUSTED_SIGNER:?Set trusted signer}
    - --trusted-workflow
    - ${CIVICLOOP_MODEL_GATEWAY_TRUSTED_WORKFLOW:?Set trusted workflow}
    - --provider-credential
    - /source/provider-credential
    - --master-key
    - /source/litellm-master-key
    - --gateway-token
    - /source/gateway-token
    - --budget-assertion-key
    - /source/budget-assertion-key
    user: 0:0
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    security_opt:
    - no-new-privileges:true
    volumes:
    - ${CIVICLOOP_MODEL_GATEWAY_OPS_DIR:-/opt/civicloop/ops}:/ops:ro
    - ${CIVICLOOP_MODEL_GATEWAY_APPROVAL_PATH:?Set root-owned approval path}:/source/model-gateway-approval.json:ro
    - ${CIVICLOOP_MODEL_GATEWAY_APPROVAL_SIGNATURE_PATH:?Set root-owned signature path}:/source/model-gateway-approval.sig:ro
    - ${CIVICLOOP_MODEL_GATEWAY_APPROVAL_VERIFIER:?Set root-owned verifier path}:/source/model-gateway-approval-verifier:ro
    - ${CIVICLOOP_MODEL_GATEWAY_CREDENTIAL_FILE:?Set root-owned provider credential path}:/source/provider-credential:ro
    - ${CIVICLOOP_MODEL_GATEWAY_MASTER_KEY_FILE:?Set root-owned master-key path}:/source/litellm-master-key:ro
    - ${CIVICLOOP_MODEL_GATEWAY_TOKEN_FILE:?Set root-owned gateway-token path}:/source/gateway-token:ro
    - ${CIVICLOOP_MODEL_GATEWAY_BUDGET_ASSERTION_KEY_FILE:?Set root-owned budget-key path}:/source/budget-assertion-key:ro
    - model-gateway-handoff:/handoff
    - model-gateway-ledger:/ledger
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=0700
    restart: 'no'
    pids_limit: 64
    cpus: '0.25'
    mem_limit: 128m
    logging:
      options:
        max-size: 10m
        max-file: '3'
  litellm:
    image: ghcr.io/berriai/litellm-non_root:v1.100.1@sha256:c36f3b27a5a817329e0fcf9c4e3a7bf58b62a5a736ad5352f0a5771c1be58404
    platform: linux/amd64
    profiles:
    - agent
    entrypoint:
    - python
    - /app/gateway.py
    command: []
    user: 65534:65534
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - hermes-data
    - provider-egress
    depends_on:
      model-gateway-init:
        condition: service_completed_successfully
    environment:
      DISABLE_ADMIN_UI: 'True'
      NO_DOCS: 'True'
      NO_REDOC: 'True'
      NO_OPENAPI: 'True'
      XDG_CACHE_HOME: /app/cache
      PRISMA_BINARY_CACHE_DIR: /app/cache/prisma-python/binaries
      LITELLM_MIGRATION_DIR: /app/migrations
      LITELLM_CONFIG_FILE: /app/config.yaml
      LITELLM_MODEL_ALIAS: civicloop-default
      LITELLM_UPSTREAM_MODEL: ${CIVICLOOP_MODEL_GATEWAY_UPSTREAM_MODEL:-openai/gpt-4.1-mini}
      LITELLM_UPSTREAM_BASE_URL: ${CIVICLOOP_MODEL_GATEWAY_UPSTREAM_BASE_URL:-https://api.openai.com/v1}
      LITELLM_REQUEST_MAX_TOKENS: '2000'
      LITELLM_REQUEST_TIMEOUT_SECONDS: '60'
      LITELLM_STARTUP_TIMEOUT_SECONDS: '180'
      CIVICLOOP_OPERATIONS_SHA: ${CIVICLOOP_OPERATIONS_SHA:?Set exact private operations SHA}
      LITELLM_INDEX_DIGEST: sha256:c36f3b27a5a817329e0fcf9c4e3a7bf58b62a5a736ad5352f0a5771c1be58404
      LITELLM_PLATFORM_DIGEST: sha256:833abd09590afee0119dd574212fb01294dcc7d940ad21fabc0bf0681a9f4aea
      MODEL_GATEWAY_STARTUP_RECEIPT: /run/model-gateway/current/receipt.json
      MODEL_GATEWAY_LEDGER_PATH: /var/lib/civicloop-model-gateway/ledger.sqlite3
    volumes:
    - type: bind
      source: ./deploy/litellm/config.yaml
      target: /app/config.yaml
      read_only: true
    - type: bind
      source: ./deploy/litellm/gateway.py
      target: /app/gateway.py
      read_only: true
    - type: volume
      source: model-gateway-handoff
      target: /run/model-gateway
      read_only: true
    - type: volume
      source: model-gateway-ledger
      target: /var/lib/civicloop-model-gateway
      read_only: false
    tmpfs:
    - /app/cache:rw,noexec,nosuid,nodev,uid=65534,gid=65534,mode=0700
    - /app/migrations:rw,noexec,nosuid,nodev,uid=65534,gid=65534,mode=0700
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 180s
    restart: unless-stopped
    pids_limit: 128
    cpus: '0.50'
    mem_limit: 1g
    logging:
      options:
        max-size: 10m
        max-file: '3'
  hermes:
    image: ${CIVICLOOP_HERMES_SCOPED_IMAGE:-civicloop-hermes-scoped:local}
    platform: linux/amd64
    profiles:
    - agent
    command:
    - /opt/hermes/.venv/bin/python
    - -m
    - deploy.hermes.controller_service
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - hermes-runtime
    depends_on:
      hermes-transport:
        condition: service_healthy
      hermes-identities-init:
        condition: service_completed_successfully
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: '10000'
      HERMES_GID: '10000'
      HERMES_DASHBOARD: 'false'
      HERMES_DISABLE_LAZY_INSTALLS: '1'
      HERMES_SAFE_MODE: '0'
      HERMES_CONTROLLER_TOKEN_FILE: /run/secrets/civicloop-hermes-controller-token
      HERMES_SHIM_CLIENT_TOKEN_FILE: /run/secrets/civicloop-hermes-shim-client-token
      HERMES_SHIM_URL: http://hermes-transport:8080
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,uid=10000,gid=10000,mode=0700
    - /opt/data:rw,noexec,nosuid,nodev,uid=10000,gid=10000,mode=0700
    - /run:rw,noexec,nosuid,nodev,uid=0,gid=0,mode=0755,size=8m
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8642/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 60s
    restart: unless-stopped
    pids_limit: 256
    cpus: '1.00'
    mem_limit: 1g
    logging:
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: ${CIVICLOOP_BUILD_CONTEXT:-.}
      dockerfile: deploy/hermes/Dockerfile.scoped
    init: true
    volumes:
    - type: volume
      source: hermes-controller-identities
      target: /run/secrets
      read_only: true
    cap_add:
    - SETUID
    - SETGID
    - DAC_OVERRIDE
  hermes-adapter:
    build:
      context: ${CIVICLOOP_BUILD_CONTEXT:-.}
    profiles:
    - agent
    entrypoint:
    - python
    - -m
    - deploy.hermes.adapter
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - agent-control
    - hermes-runtime
    depends_on:
      hermes:
        condition: service_healthy
      hermes-identities-init:
        condition: service_completed_successfully
    environment:
      PORT: '8080'
      HERMES_UPSTREAM_URL: http://hermes:8642
      HERMES_POLL_INTERVAL_SECONDS: '0.5'
      HERMES_ADAPTER_TOKEN_FILE: /run/secrets/civicloop-hermes-service-token
      HERMES_UPSTREAM_TOKEN_FILE: /run/secrets/civicloop-hermes-upstream-token
      PYTHONPATH: /app/runtime
      HERMES_TRANSPORT_CONTROL_URL: http://hermes-transport:8080
      HERMES_TRANSPORT_CONTROL_TOKEN_FILE: /run/secrets/civicloop-hermes-transport-control-token
      HERMES_CONTROLLER_URL: http://hermes:8642
      HERMES_CONTROLLER_TOKEN_FILE: /run/secrets/civicloop-hermes-controller-token
    volumes:
    - type: volume
      source: hermes-adapter-identities
      target: /run/secrets
      read_only: true
    - type: bind
      source: ./deploy
      target: /app/runtime/deploy
      read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    pids_limit: 64
    cpus: '0.25'
    mem_limit: 128m
    logging:
      options:
        max-size: 10m
        max-file: '3'
    image: civicloop:local
  hermes-transport:
    profiles:
    - agent
    entrypoint:
    - python
    - -m
    - deploy.hermes.transport_service
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - agent-control
    - hermes-runtime
    - hermes-data
    depends_on:
      mcp:
        condition: service_healthy
      litellm:
        condition: service_healthy
      hermes-identities-init:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /app/runtime
      PORT: '8080'
      CIVICLOOP_HERMES_ENABLED: ${CIVICLOOP_HERMES_ENABLED:-false}
      CIVICLOOP_HERMES_PENDING_OPERATIONS_ENABLED: ${CIVICLOOP_HERMES_PENDING_OPERATIONS_ENABLED:-false}
      HERMES_TRANSPORT_MCP_URL: http://mcp:8000/internal/v1/mcp
      HERMES_TRANSPORT_GATEWAY_URL: http://litellm:4000/v1/chat/completions
      HERMES_TRANSPORT_INPUT_MICROUSD_PER_MILLION: '400000'
      HERMES_TRANSPORT_OUTPUT_MICROUSD_PER_MILLION: '1600000'
      HERMES_TRANSPORT_CONTROL_TOKEN_FILE: /run/secrets/civicloop-hermes-transport-control-token
      HERMES_TRANSPORT_CLIENT_TOKEN_FILE: /run/secrets/civicloop-hermes-shim-client-token
      HERMES_TRANSPORT_MCP_TOKEN_FILE: /run/secrets/civicloop-mcp-token
      HERMES_TRANSPORT_GATEWAY_TOKEN_FILE: /run/secrets/civicloop-hermes-gateway-token
      HERMES_TRANSPORT_ASSERTION_KEY_FILE: /run/secrets/civicloop-hermes-budget-assertion-key
    volumes:
    - type: volume
      source: hermes-transport-identities
      target: /run/secrets
      read_only: true
    - type: bind
      source: ./deploy
      target: /app/runtime/deploy
      read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    pids_limit: 64
    cpus: '0.25'
    mem_limit: 128m
    logging:
      options:
        max-size: 10m
        max-file: '3'
    image: civicloop:local
  hermes-identities-init:
    image: civicloop:local
    profiles:
    - agent
    entrypoint:
    - python
    - -m
    - deploy.hermes.identity_init
    user: 0:0
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    security_opt:
    - no-new-privileges:true
    environment:
      PYTHONPATH: /app/runtime
    volumes:
    - type: bind
      source: ./deploy
      target: /app/runtime/deploy
      read_only: true
    - type: volume
      source: hermes-worker-identities
      target: /handoff/worker
      read_only: false
    - type: volume
      source: hermes-adapter-identities
      target: /handoff/adapter
      read_only: false
    - type: volume
      source: hermes-controller-identities
      target: /handoff/controller
      read_only: false
    - type: volume
      source: hermes-transport-identities
      target: /handoff/transport
      read_only: false
    - type: volume
      source: hermes-mcp-identities
      target: /handoff/mcp
      read_only: false
    secrets:
    - source: civicloop-mcp-token
      target: /source/civicloop-mcp-token
    - source: civicloop-hermes-service-token
      target: /source/civicloop-hermes-service-token
    - source: civicloop-hermes-upstream-token
      target: /source/civicloop-hermes-upstream-token
    - source: civicloop-hermes-controller-token
      target: /source/civicloop-hermes-controller-token
    - source: civicloop-hermes-shim-client-token
      target: /source/civicloop-hermes-shim-client-token
    - source: civicloop-hermes-transport-control-token
      target: /source/civicloop-hermes-transport-control-token
    - source: civicloop-hermes-gateway-token
      target: /source/civicloop-hermes-gateway-token
    - source: civicloop-hermes-budget-assertion-key
      target: /source/civicloop-hermes-budget-assertion-key
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=0700
    restart: 'no'
    pids_limit: 32
    cpus: '0.25'
    mem_limit: 64m
    logging:
      options:
        max-size: 10m
        max-file: '3'
networks:
  agent-control:
    internal: true
  hermes-runtime:
    internal: true
  provider-egress: {}
  hermes-data:
    internal: true
volumes:
  model-gateway-handoff: {}
  model-gateway-ledger: {}
  hermes-worker-identities: {}
  hermes-adapter-identities: {}
  hermes-controller-identities: {}
  hermes-transport-identities: {}
  hermes-mcp-identities: {}
secrets:
  civicloop-mcp-token:
    file: ${CIVICLOOP_HERMES_MCP_TOKEN_FILE:?Set distinct Hermes-to-MCP identity file}
  civicloop-hermes-service-token:
    file: ${CIVICLOOP_HERMES_SERVICE_TOKEN_FILE:?Set CivicLoop-to-adapter token file}
  civicloop-hermes-upstream-token:
    file: ${CIVICLOOP_HERMES_UPSTREAM_TOKEN_FILE:?Set adapter-to-Hermes token file}
  civicloop-hermes-controller-token:
    file: ${CIVICLOOP_HERMES_CONTROLLER_TOKEN_FILE:?Set protected distinct Hermes controller-token file}
  civicloop-hermes-shim-client-token:
    file: ${CIVICLOOP_HERMES_SHIM_CLIENT_TOKEN_FILE:?Set protected distinct Hermes shim-client-token file}
  civicloop-hermes-transport-control-token:
    file: ${CIVICLOOP_HERMES_TRANSPORT_CONTROL_TOKEN_FILE:?Set protected distinct Hermes transport-control-token
      file}
  civicloop-hermes-gateway-token:
    file: ${CIVICLOOP_MODEL_GATEWAY_TOKEN_FILE:?Set protected shared gateway-token backing file}
  civicloop-hermes-budget-assertion-key:
    file: ${CIVICLOOP_MODEL_GATEWAY_BUDGET_ASSERTION_KEY_FILE:?Set protected shared budget-key backing
      file}
